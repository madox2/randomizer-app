name: Deploy web

# Publishes the web app to GitHub Pages on every push to master.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a newer deployment replaces a running one, a started deployment is not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: npm
        cache-dependency-path: ./package-lock.json
    - run: npm ci
    - run: npm run typecheck
    - run: npm test
    - name: Build the web app
      run: npx expo export --platform web
      env:
        # served from https://<user>.github.io/<repo>/
        EXPO_BASE_URL: /${{ github.event.repository.name }}
    # files and folders starting with an underscore (_expo) must not be skipped
    - run: touch dist/.nojekyll
    - uses: actions/configure-pages@v5
    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
